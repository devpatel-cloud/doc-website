services:
  document-server:
    image: nginx:1.25-alpine
    container_name: lightweight-document-server
    restart: unless-stopped
    ports:
      - "8085:80"
      # To run directly on standard HTTP port 80 in production, change to:
      # - "80:80"
      # To enable HTTPS in production with SSL certificates:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./website:/var/www/website:ro
      - ./documents:/var/www/documents:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
