services:
  fastapi:
    build: ./app
    container_name: docvault-fastapi
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DOCVAULT_ADMIN_PASSWORD=${DOCVAULT_ADMIN_PASSWORD}
      - DOCVAULT_MAX_FILE_SIZE_MB=${DOCVAULT_MAX_FILE_SIZE_MB:-20480}
      - DOCVAULT_MIN_FREE_DISK_GB=${DOCVAULT_MIN_FREE_DISK_GB:-2.5}
      - DOCVAULT_SESSION_SECRET=${DOCVAULT_SESSION_SECRET}
      - DOCUMENTS_DIR=/documents
    volumes:
      - ./documents:/documents:rw
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/status')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  document-server:
    image: nginx:1.25-alpine
    container_name: lightweight-document-server
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    ports:
      - "8085:80"
      # To run directly on standard HTTP port 80 in production, change to:
      # - "80:80"
      # To enable HTTPS in production with SSL certificates:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./website:/var/www/website:ro
      - ./documents:/var/www/documents:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
