user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/pdf;

    # Rate limiting: 10 requests/sec per IP with burst capacity
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    server {
        listen       80;
        server_name  localhost;

        root   /var/www/website;
        index  index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; object-src 'self' blob:; frame-src 'self' blob:;" always;

        # Restrict HTTP methods (Read-only document portal)
        if ($request_method !~ ^(GET|HEAD)$ ) {
            return 405;
        }

        # Prevent Directory Traversal & Hidden File Access
        location ~ /\. {
            deny all;
            return 404;
        }

        # Static Web Application Files
        location / {
            try_files $uri $uri/ /index.html;
            limit_req zone=req_limit burst=20 nodelay;

            # Cache static UI assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 7d;
                add_header Cache-Control "public, no-transform";
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
            }
        }

        # Documents Directory Listing API (JSON format for dynamic frontend consumption)
        location = /api/documents {
            alias /var/www/documents/;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime on;
            limit_req zone=req_limit burst=30 nodelay;
        }

        location /api/documents/ {
            alias /var/www/documents/;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime on;
            limit_req zone=req_limit burst=30 nodelay;
        }

        # Direct Document Access and Downloading
        location /documents/ {
            alias /var/www/documents/;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime on;
            limit_req zone=req_limit burst=30 nodelay;

            # Serve standard document MIME types inline where browser-compatible
            types {
                application/pdf pdf;
                image/png png;
                image/jpeg jpg jpeg;
                image/svg+xml svg;
                image/webp webp;
                text/plain txt log md;
                application/json json;
                application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
                application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
                application/zip zip;
            }
            
            # Disable execution of scripts/binaries in documents directory
            location ~* \.(php|pl|py|jsp|asp|sh|cgi|bash|exe)$ {
                default_type text/plain;
                add_header Content-Disposition "attachment";
            }
        }

        # Custom Error Pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/www/website;
        }
    }
}
