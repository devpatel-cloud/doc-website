user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Max upload file size limit (2 Gigabytes for large video uploads)
    client_max_body_size 2G;
    client_body_timeout 1800s;

    # Gzip Compression (Excluded for videos and zip files)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/pdf;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    server {
        listen       80;
        listen       [::]:80;
        server_name  localhost;

        root   /var/www/website;
        index  index.html;

        # Strict Production Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; object-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob:;" always;

        # EXPLICITLY BLOCK PUBLIC ACCESS TO ALL CONFIG & SYSTEM FILES
        location ~* ^/(\.env|\.git|\.gitignore|docker-compose\.yml|Dockerfile|requirements\.txt|SERVER-SETUP\.md|README\.md|LINK-STRUCTURE\.md)$ {
            deny all;
            return 404;
        }

        # Prevent Directory Traversal & Hidden File Access
        location ~ /\. {
            deny all;
            return 404;
        }

        # Static Web Application Files
        location / {
            try_files $uri $uri/ /index.html;
            limit_req zone=req_limit burst=20 nodelay;

            # Cache static UI assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 7d;
                add_header Cache-Control "public, no-transform";
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
            }
        }

        # Public Documents Directory Listing API (JSON format for frontend traversal)
        location /api/documents/ {
            alias /var/www/documents/;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime on;
            limit_req zone=req_limit burst=30 nodelay;
        }

        location = /api/documents {
            alias /var/www/documents/;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime on;
            limit_req zone=req_limit burst=30 nodelay;
        }

        # Dedicated Unbuffered Upload Proxy Endpoint (Fixes Large Video Network Disconnects)
        location = /api/upload {
            proxy_pass http://fastapi:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_request_buffering off; # Direct streaming proxying to FastAPI
            proxy_read_timeout 1800s;
            proxy_connect_timeout 1800s;
            proxy_send_timeout 1800s;
            client_body_timeout 1800s;
            limit_req zone=req_limit burst=50 nodelay;
        }

        # FastAPI Backend API (Auth, Folder Tree)
        location /api/ {
            proxy_pass http://fastapi:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800s;
            proxy_connect_timeout 1800s;
            proxy_send_timeout 1800s;
            limit_req zone=req_limit burst=30 nodelay;
        }

        # Direct Document Access, Video Streaming, and Byte-Range Requests (Served directly by Nginx)
        location /documents/ {
            alias /var/www/documents/;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime on;
            limit_req zone=req_limit burst=50 nodelay;

            # Serve document, image, and video MIME types inline
            types {
                application/pdf pdf;
                image/png png;
                image/jpeg jpg jpeg;
                image/webp webp;
                text/plain txt log md;
                application/json json;
                application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
                application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
                application/zip zip;
                video/mp4 mp4 m4v;
                video/webm webm;
                video/x-matroska mkv;
                video/quicktime mov;
                video/x-msvideo avi;
                video/3gpp 3gp;
                video/mpeg mpeg mpg;
            }
            
            # Disable execution of scripts/binaries in documents directory
            location ~* \.(php|pl|py|jsp|asp|sh|cgi|bash|exe)$ {
                default_type text/plain;
                add_header Content-Disposition "attachment";
            }
        }

        # Custom Error Pages
        error_page 400 /errors/400.html;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 413 /errors/413.html;
        error_page 429 /errors/429.html;
        error_page 500 /errors/500.html;
        error_page 502 /errors/502.html;
        error_page 503 /errors/503.html;

        location /errors/ {
            alias /var/www/website/errors/;
            expires 1d;
            add_header Cache-Control "public, no-transform";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
