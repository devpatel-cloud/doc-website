<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>429 — Rate Limit Exceeded | DocVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/errors/error.css">
</head>
<body class="theme-amber">

  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-dot-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <a href="/#/" class="error-header" title="Return to DocVault Home">
    <div class="brand-icon">📁</div>
    <div class="brand-text">
      <h1>DocVault</h1>
      <p>Public Document Explorer</p>
    </div>
  </a>

  <main class="error-container">
    <div class="error-card">
      <div class="hero-number">429</div>

      <!-- Custom SVG Illustration: Rate Limit Meter -->
      <div class="illustration-box" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="42" stroke="#1e293b" stroke-width="8"/>
          <circle cx="60" cy="60" r="42" stroke="#f59e0b" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="80" stroke-linecap="round"/>
          <circle cx="60" cy="60" r="8" fill="#f59e0b"/>
          <line x1="60" y1="60" x2="80" y2="40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <h2 class="error-title">Too Many Requests</h2>
      <p class="error-desc">
        DocVault is receiving a high rate of requests right now. Please take a short breather and try again in a minute.
      </p>

      <div class="action-buttons">
        <button id="btn-try-again" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
          Try Again
        </button>
        <a href="/#/" id="btn-go-home" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
          Go Home
        </a>
      </div>
    </div>
  </main>

  <footer class="error-footer">
    <p>DocVault &bull; Public Document Explorer</p>
  </footer>

  <script src="/errors/error.js"></script>
</body>
</html>
