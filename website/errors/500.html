<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error | DocVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/errors/error.css">
</head>
<body class="theme-red">

  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-dot-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <a href="/#/" class="error-header" title="Return to DocVault Home">
    <div class="brand-icon">📁</div>
    <div class="brand-text">
      <h1>DocVault</h1>
      <p>Public Document Explorer</p>
    </div>
  </a>

  <main class="error-container">
    <div class="error-card">
      <div class="hero-number">500</div>

      <!-- Custom SVG Illustration: Glitching Server Node -->
      <div class="illustration-box" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="25" y="30" width="70" height="26" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
          <rect x="25" y="64" width="70" height="26" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
          <circle cx="38" cy="43" r="3" fill="#ef4444"/>
          <circle cx="48" cy="43" r="3" fill="#64748b"/>
          <circle cx="38" cy="77" r="3" fill="#ef4444"/>
          <circle cx="48" cy="77" r="3" fill="#64748b"/>
          <path d="M72 43H82M72 77H82" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
          <path d="M55 20L65 100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
        </svg>
      </div>

      <h2 class="error-title">Internal Server Error</h2>
      <p class="error-desc">
        Something went wrong on our side while processing this request. Our system logs have recorded the event for review.
      </p>

      <div class="action-buttons">
        <button id="btn-try-again" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
          Try Again
        </button>
        <a href="/#/" id="btn-go-home" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
          Go Home
        </a>
      </div>
    </div>
  </main>

  <footer class="error-footer">
    <p>DocVault &bull; Public Document Explorer</p>
  </footer>

  <script src="/errors/error.js"></script>
</body>
</html>
