<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>405 — Method Not Allowed | DocVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/errors/error.css">
</head>
<body class="theme-amber">

  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-dot-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <a href="/#/" class="error-header" title="Return to DocVault Home">
    <div class="brand-icon">📁</div>
    <div class="brand-text">
      <h1>DocVault</h1>
      <p>Public Document Explorer</p>
    </div>
  </a>

  <main class="error-container">
    <div class="error-card">
      <div class="hero-number">405</div>

      <div class="illustration-box" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="40" stroke="#f59e0b" stroke-width="3"/>
          <line x1="32" y1="32" x2="88" y2="88" stroke="#f59e0b" stroke-width="3"/>
        </svg>
      </div>

      <h2 class="error-title">Method Not Allowed</h2>
      <p class="error-desc">
        The HTTP action requested is not supported for this endpoint.
      </p>

      <div class="action-buttons">
        <a href="/#/" id="btn-go-home" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
          Go Home
        </a>
      </div>
    </div>
  </main>

  <footer class="error-footer">
    <p>DocVault &bull; Public Document Explorer</p>
  </footer>

  <script src="/errors/error.js"></script>
</body>
</html>
