<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>413 — File Too Large | DocVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/errors/error.css">
</head>
<body class="theme-amber">

  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-dot-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <a href="/#/" class="error-header" title="Return to DocVault Home">
    <div class="brand-icon">📁</div>
    <div class="brand-text">
      <h1>DocVault</h1>
      <p>Public Document Explorer</p>
    </div>
  </a>

  <main class="error-container">
    <div class="error-card">
      <div class="hero-number">413</div>

      <!-- Custom SVG Illustration: Overflowing Storage Box -->
      <div class="illustration-box" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M25 60L60 45L95 60L60 75L25 60Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
          <path d="M25 60V85L60 100V75L25 60Z" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
          <path d="M95 60V85L60 100V75L95 60Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
          <rect x="42" y="15" width="36" height="48" rx="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
          <path d="M50 28H70M50 36H64" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <h2 class="error-title">File Exceeds Upload Limit</h2>
      <p class="error-desc">
        This file is too large for the configured server upload size limit. Please choose a smaller document or compress your media file before trying again.
      </p>

      <div class="action-buttons">
        <button id="btn-go-back" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          Choose Another File
        </button>
        <a href="/#/" id="btn-go-home" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
          Go Home
        </a>
      </div>
    </div>
  </main>

  <footer class="error-footer">
    <p>DocVault &bull; Public Document Explorer</p>
  </footer>

  <script src="/errors/error.js"></script>
</body>
</html>
